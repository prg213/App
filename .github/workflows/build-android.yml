name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Patch all files and write Metro stub
        run: |
          python3 - << 'PYEOF'
          import json, os, re

          # Root package.json
          with open("package.json") as f:
              pkg = json.load(f)
          pkg["packageManager"] = "pnpm@9.0.0"
          with open("package.json", "w") as f:
              json.dump(pkg, f, indent=2)

          # app.json
          with open("artifacts/iptv-app/app.json") as f:
              app = json.load(f)
          app["expo"].setdefault("android", {})["package"] = "com.prg213.streamvault"
          app["expo"]["newArchEnabled"] = False
          with open("artifacts/iptv-app/app.json", "w") as f:
              json.dump(app, f, indent=2)

          # iptv-app package.json - remove workspace dep
          with open("artifacts/iptv-app/package.json") as f:
              iptv = json.load(f)
          for s in ("dependencies", "devDependencies"):
              iptv.get(s, {}).pop("@workspace/api-client-react", None)
          with open("artifacts/iptv-app/package.json", "w") as f:
              json.dump(iptv, f, indent=2)

          # tsconfig.json - remove dangling project reference to lib/api-client-react
          with open("artifacts/iptv-app/tsconfig.json") as f:
              tsconfig = json.load(f)
          tsconfig.pop("references", None)
          with open("artifacts/iptv-app/tsconfig.json", "w") as f:
              json.dump(tsconfig, f, indent=2)

          # _layout.tsx - ensure @workspace import is gone (safety net)
          with open("artifacts/iptv-app/app/_layout.tsx") as f:
              layout = f.read()
          layout = re.sub(
              r"import\s*\{[^}]*\}\s*from\s*['\"]@workspace/api-client-react['\"];?\n?",
              (
                  "// setBaseUrl inlined for EAS builds\n"
                  "let _apiBaseUrl: string | null = null;\n"
                  "function setBaseUrl(url: string | null) { _apiBaseUrl = url ? url.replace(/\\/+$/, '') : null; }\n"
              ),
              layout
          )
          with open("artifacts/iptv-app/app/_layout.tsx", "w") as f:
              f.write(layout)

          # eas-stubs/api-client-react.js
          os.makedirs("artifacts/iptv-app/eas-stubs", exist_ok=True)
          with open("artifacts/iptv-app/eas-stubs/api-client-react.js", "w") as f:
              f.write(
                  "let _b=null;\n"
                  "function setBaseUrl(u){_b=u?u.replace(/\\/+$/,''):null;}\n"
                  "function setAuthTokenGetter(g){}\n"
                  "module.exports={setBaseUrl,setAuthTokenGetter};\n"
              )

          # metro.config.js - custom resolver
          with open("artifacts/iptv-app/metro.config.js", "w") as f:
              f.write("\n".join([
                  "const {getDefaultConfig}=require('expo/metro-config');",
                  "const path=require('path');",
                  "const config=getDefaultConfig(__dirname);",
                  "const _rr=config.resolver&&config.resolver.resolveRequest;",
                  "config.resolver=config.resolver||{};",
                  "config.resolver.resolveRequest=function(ctx,mod,plat){",
                  "  if(mod==='@workspace/api-client-react'){",
                  "    return{filePath:path.resolve(__dirname,'eas-stubs/api-client-react.js'),type:'sourceFile'};",
                  "  }",
                  "  if(_rr)return _rr(ctx,mod,plat);",
                  "  return ctx.resolveRequest(ctx,mod,plat);",
                  "};",
                  "module.exports=config;",
                  "",
              ]))

          print("All patches written")
          PYEOF

      - name: Commit patches so EAS git-archive includes them
        run: |
          git config user.email "ci@build.local"
          git config user.name "EAS CI"
          git add -A
          git diff --cached --stat
          git commit -m "chore: EAS build patches [skip ci]" || echo "Nothing to commit"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Initialise EAS project
        working-directory: artifacts/iptv-app
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: artifacts/iptv-app
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive
        env:
