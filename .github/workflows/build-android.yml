name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Patch configs and write Metro stub
        run: |
          python3 - << 'PYEOF'
          import json, os

          # Root package.json
          with open("package.json") as f:
              pkg = json.load(f)
          pkg["packageManager"] = "pnpm@9.0.0"
          with open("package.json", "w") as f:
              json.dump(pkg, f, indent=2)

          # app.json
          with open("artifacts/iptv-app/app.json") as f:
              app = json.load(f)
          app["expo"].setdefault("android", {})["package"] = "com.prg213.streamvault"
          app["expo"]["newArchEnabled"] = False
          with open("artifacts/iptv-app/app.json", "w") as f:
              json.dump(app, f, indent=2)

          # iptv-app package.json - remove workspace dep
          with open("artifacts/iptv-app/package.json") as f:
              iptv = json.load(f)
          for s in ("dependencies", "devDependencies"):
              iptv.get(s, {}).pop("@workspace/api-client-react", None)
          with open("artifacts/iptv-app/package.json", "w") as f:
              json.dump(iptv, f, indent=2)

          # EAS stub for @workspace/api-client-react
          os.makedirs("artifacts/iptv-app/eas-stubs", exist_ok=True)
          with open("artifacts/iptv-app/eas-stubs/api-client-react.js", "w") as f:
              f.write(
                  "let _b=null;\n"
                  "function setBaseUrl(u){_b=u?u.replace(/\\/+$/,''):null;}\n"
                  "function setAuthTokenGetter(g){}\n"
                  "module.exports={setBaseUrl,setAuthTokenGetter};\n"
              )

          # metro.config.js with custom resolver
          with open("artifacts/iptv-app/metro.config.js", "w") as f:
              f.write(
                  "const {getDefaultConfig}=require('expo/metro-config');\n"
                  "const path=require('path');\n"
                  "const config=getDefaultConfig(__dirname);\n"
                  "const _rr=config.resolver&&config.resolver.resolveRequest;\n"
                  "config.resolver=config.resolver||{};\n"
                  "config.resolver.resolveRequest=function(ctx,mod,plat){\n"
                  "  if(mod==='@workspace/api-client-react'){\n"
                  "    return{filePath:path.resolve(__dirname,'eas-stubs/api-client-react.js'),type:'sourceFile'};\n"
                  "  }\n"
                  "  if(_rr)return _rr(ctx,mod,plat);\n"
                  "  return ctx.resolveRequest(ctx,mod,plat);\n"
                  "};\n"
                  "module.exports=config;\n"
              )

          print("All patches applied")
          PYEOF

      - name: Commit patches so EAS archives them
        run: |
          git config user.email "ci@build.local"
          git config user.name "EAS CI"
          git add -A
          git commit -m "chore: EAS build patches [skip ci]"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Initialise EAS project
        working-directory: artifacts/iptv-app
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: artifacts/iptv-app
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        working-directory: artifacts/iptv-app
        run: |
          APK_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'])")
          curl -L "$APK_URL" -o streamvault.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-${{ github.event.inputs.profile }}-${{ github.run_number }}
          path: artifacts/iptv-app/streamvault.apk
          retention-days: 30
