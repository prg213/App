name: Build Android APK

"on":
  workflow_dispatch: {}
  repository_dispatch:
    types: [build-android]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: AsyncStorage write ban (ESLint)
        run: pnpm --filter @workspace/iptv-app run lint

      - name: EPG scroll guard
        run: bash artifacts/iptv-app/scripts/check-epg-scroll-not-persisted.sh

      - name: In-memory state guard
        run: bash artifacts/iptv-app/scripts/check-inmemory-not-persisted.sh

      - name: Typecheck
        run: pnpm --filter @workspace/iptv-app run typecheck

      - name: Typecheck tests
        run: pnpm --filter @workspace/iptv-app run typecheck:tests

      - name: Verify Android packaging guards
        run: pnpm --filter @workspace/iptv-app exec jest __tests__/androidReleasePackaging.test.ts __tests__/mp2AudioPlayback.test.ts --runInBand

      - name: Expo prebuild
        working-directory: artifacts/iptv-app
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1
          EXPO_PUBLIC_DOMAIN: streamvault.rip
          EXPO_PUBLIC_TMDB_API_KEY: 312ee14dd7f250471da1174324be2bda
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" \
            --sdk_root=$ANDROID_HOME

      - name: Restore signing keystore
        working-directory: artifacts/iptv-app/android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        working-directory: artifacts/iptv-app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=streamvault123 \
            -Pandroid.injected.signing.key.alias=streamvault \
            -Pandroid.injected.signing.key.password=streamvault123 \
            -x lintVitalAnalyzeRelease \
            -x lintAnalyzeRelease \
            --stacktrace --no-daemon 2>&1 | tee build.log
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          EXPO_PUBLIC_DOMAIN: streamvault.rip
          EXPO_PUBLIC_TMDB_API_KEY: 312ee14dd7f250471da1174324be2bda
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Stage universal and fallback APKs
        run: |
          set -euo pipefail
          OUTPUT_DIR="artifacts/iptv-app/android/app/build/outputs/apk/release"
          UNIVERSAL_APK="$(find "$OUTPUT_DIR" -name '*universal*release.apk' -print -quit)"
          ARM32_APK="$(find "$OUTPUT_DIR" -name '*armeabi-v7a*release.apk' -print -quit)"
          ARM64_APK="$(find "$OUTPUT_DIR" -name '*arm64-v8a*release.apk' -print -quit)"

          test -n "$UNIVERSAL_APK"
          test -n "$ARM32_APK"
          test -n "$ARM64_APK"

          # The stable download must run on both Fire TV (ARM32) and modern
          # Android phones (ARM64). Named split files remain only as fallback
          # diagnostics if a device has an unusual installer limitation.
          cp "$UNIVERSAL_APK" StreamVault.apk
          cp "$ARM32_APK" StreamVault-armeabi-v7a.apk
          cp "$ARM64_APK" StreamVault-arm64-v8a.apk

      - name: Verify universal APK contents
        run: |
          python3 - <<'PY'
          import zipfile

          apk = zipfile.ZipFile("StreamVault.apk")
          for abi in ("armeabi-v7a", "arm64-v8a"):
              native_entries = [
                  entry for entry in apk.infolist()
                  if entry.filename.startswith(f"lib/{abi}/") and not entry.is_dir()
              ]
              assert native_entries, f"StreamVault.apk has no {abi} native libraries"
              stored_entries = [
                  entry.filename for entry in native_entries
                  if entry.compress_type == zipfile.ZIP_STORED
              ]
              assert not stored_entries, (
                  f"{abi} native libraries must be compressed to keep the universal "
                  f"APK small enough for Fire TV: {stored_entries[:3]}"
              )
          print("Verified compressed ARM32 and ARM64 native libraries.")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StreamVault v${{ github.run_number }}
          body: |
            Android APK test candidate — build #${{ github.run_number }}

             **All supported Fire TV and Android phones:** Download StreamVault.apk.

             This candidate uses one compressed universal APK containing both
             ARM32 and ARM64 libraries. Test it on Fire TV and mobile before
             promoting it to the stable latest release.

             Architecture-specific files are retained only as installation fallbacks.
          files: |
            StreamVault.apk
            StreamVault-armeabi-v7a.apk
            StreamVault-arm64-v8a.apk
          # Keep the known-working build as "latest" until this universal
          # candidate has been installed successfully on both device classes.
          make_latest: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-release-${{ github.run_number }}
          path: |
            StreamVault.apk
            StreamVault-armeabi-v7a.apk
            StreamVault-arm64-v8a.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: artifacts/iptv-app/android/build.log
          retention-days: 7
