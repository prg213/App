name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild (generate android/ project)
        working-directory: artifacts/iptv-app
        run: npx expo prebuild --platform android --no-install --clean
        env:
          # suppress interactive prompts
          CI: 1

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" \
            --sdk_root=$ANDROID_HOME
          echo "NDK_VERSION=27.1.12297006" >> $GITHUB_ENV

      - name: Build APK
        working-directory: artifacts/iptv-app/android
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          else
            ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-${{ github.event.inputs.variant }}-${{ github.run_number }}
          path: |
            artifacts/iptv-app/android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/iptv-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: artifacts/iptv-app/android/build.log
          retention-days: 7
