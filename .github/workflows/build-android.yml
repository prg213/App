name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Patch configs for EAS
        run: |
          python3 - <<'EOF'
          import json, re

          # Root package.json
          with open("package.json", "r") as f:
              pkg = json.load(f)
          pkg["packageManager"] = "pnpm@9.0.0"
          with open("package.json", "w") as f:
              json.dump(pkg, f, indent=2)

          # app.json
          with open("artifacts/iptv-app/app.json", "r") as f:
              app = json.load(f)
          app["expo"].setdefault("android", {})["package"] = "com.prg213.streamvault"
          app["expo"]["newArchEnabled"] = False
          with open("artifacts/iptv-app/app.json", "w") as f:
              json.dump(app, f, indent=2)

          # iptv-app package.json — remove workspace dep
          with open("artifacts/iptv-app/package.json", "r") as f:
              iptv_pkg = json.load(f)
          for section in ("dependencies", "devDependencies"):
              iptv_pkg.get(section, {}).pop("@workspace/api-client-react", None)
          with open("artifacts/iptv-app/package.json", "w") as f:
              json.dump(iptv_pkg, f, indent=2)

          # _layout.tsx — replace the @workspace import with an inline stub
          with open("artifacts/iptv-app/app/_layout.tsx", "r") as f:
              layout = f.read()

          stub = (
              "// setBaseUrl inlined — @workspace/api-client-react not available in EAS\n"
              "let _apiBaseUrl: string | null = null;\n"
              "function setBaseUrl(url: string | null) { _apiBaseUrl = url ? url.replace(/\\/+$/, '') : null; }"
          )

          # Remove any existing import of setBaseUrl from @workspace/api-client-react
          layout = re.sub(
              r"import\s*\{[^}]*setBaseUrl[^}]*\}\s*from\s*['\"]@workspace/api-client-react['\"];?\n?",
              stub + "\n",
              layout
          )

          with open("artifacts/iptv-app/app/_layout.tsx", "w") as f:
              f.write(layout)

          print("All patches applied")
          EOF

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Initialise EAS project
        working-directory: artifacts/iptv-app
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: artifacts/iptv-app
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        working-directory: artifacts/iptv-app
        run: |
          APK_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'])")
          curl -L "$APK_URL" -o streamvault.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-${{ github.event.inputs.profile }}-${{ github.run_number }}
          path: artifacts/iptv-app/streamvault.apk
          retention-days: 30
