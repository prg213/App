name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Patch configs for EAS
        run: |
          python3 - <<'EOF'
          import json

          with open("package.json", "r") as f:
              pkg = json.load(f)
          pkg["packageManager"] = "pnpm@9.0.0"
          with open("package.json", "w") as f:
              json.dump(pkg, f, indent=2)

          with open("artifacts/iptv-app/app.json", "r") as f:
              app = json.load(f)
          app["expo"].setdefault("android", {})["package"] = "com.prg213.streamvault"
          app["expo"]["newArchEnabled"] = False
          with open("artifacts/iptv-app/app.json", "w") as f:
              json.dump(app, f, indent=2)

          with open("artifacts/iptv-app/package.json", "r") as f:
              iptv_pkg = json.load(f)
          for section in ("dependencies", "devDependencies"):
              iptv_pkg.get(section, {}).pop("@workspace/api-client-react", None)
          with open("artifacts/iptv-app/package.json", "w") as f:
              json.dump(iptv_pkg, f, indent=2)

          print("JSON patches applied")
          EOF

      - name: Write Metro resolver stub
        run: |
          mkdir -p artifacts/iptv-app/eas-stubs

          cat > artifacts/iptv-app/eas-stubs/api-client-react.js << 'STUB'
let _baseUrl = null;
function setBaseUrl(url) { _baseUrl = url ? url.replace(/\/+$/, '') : null; }
function setAuthTokenGetter(getter) {}
module.exports = { setBaseUrl, setAuthTokenGetter };
STUB

          cat > artifacts/iptv-app/metro.config.js << 'METRO'
const { getDefaultConfig } = require('expo/metro-config');
const path = require('path');

const config = getDefaultConfig(__dirname);

const _resolveRequest = config.resolver && config.resolver.resolveRequest;
config.resolver = config.resolver || {};
config.resolver.resolveRequest = function(context, moduleName, platform) {
  if (moduleName === '@workspace/api-client-react') {
    return {
      filePath: path.resolve(__dirname, 'eas-stubs/api-client-react.js'),
      type: 'sourceFile',
    };
  }
  if (_resolveRequest) return _resolveRequest(context, moduleName, platform);
  return context.resolveRequest(context, moduleName, platform);
};

module.exports = config;
METRO

      - name: Commit patches so EAS archives them
        working-directory: artifacts/iptv-app
        run: |
          git config --global user.email "ci@build.local"
          git config --global user.name "EAS CI"
          git add -A
          git commit -m "chore: EAS build patches [skip ci]"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Initialise EAS project
        working-directory: artifacts/iptv-app
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: artifacts/iptv-app
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        working-directory: artifacts/iptv-app
        run: |
          APK_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'])")
          curl -L "$APK_URL" -o streamvault.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-${{ github.event.inputs.profile }}-${{ github.run_number }}
          path: artifacts/iptv-app/streamvault.apk
          retention-days: 30
